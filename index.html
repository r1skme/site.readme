      html,

      #boot {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: #060b15;
      }
      .boot-inner {
        display: grid;
        place-items: center;
        transition: opacity 0.3s ease;
      }
      .boot-inner.is-leaving {
        opacity: 0;
      }
      #boot:has(.is-leaving) {
        background: transparent;
        transition: background 0.3s ease;
      }
      .boot-static {
        width: min(50vw, 330px);
        height: min(50vw, 330px);
        filter: drop-shadow(0 0 30px rgb(95 220 240 / 0.45));
        opacity: 0.22;
      }
