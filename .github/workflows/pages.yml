name: Build, test and publish multipage portfolio
on:
  push:
    branches: [main, 'design/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact direct dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build all routes
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser and route tests
        run: npm run test:qa
      - name: Verify root-domain assets and direct routes
        run: node scripts/qa-domain.mjs
      - name: Compact visual proof
        if: always()
        run: |
          python -m pip install --quiet pillow
          python scripts/preview-proof.py
      - name: Save QA screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-qa
          path: |
            qa-output/
            qa-domain-local/
          if-no-files-found: ignore
      - name: Save reproducible dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lock
          path: package-lock.json
      - name: Upload ready website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish only after checks pass
        id: deployment
        uses: actions/deploy-pages@v4
  live-check:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check the public predict.rip deployment
        run: node scripts/qa-domain.mjs --live
      - name: Save public-domain screenshots and network report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predict-domain-live
          path: qa-domain-live/
          if-no-files-found: ignore
