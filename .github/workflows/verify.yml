name: Verify Multipage Portfolio
on:
  push:
    branches: ['redesign/multipage-v4']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Upload built site for review
        uses: actions/upload-artifact@v4
        with:
          name: r1sk-preview-dist
          path: dist
